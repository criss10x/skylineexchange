<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Skyline — Skyline Exchange</title>
  <meta name="description" content="Contact Skyline Exchange in Bali via WhatsApp, Instagram, Google Review, or Google Maps." />

       and let /contact be the one page that ranks. -->

  <meta name="theme-color" content="#00E1D3" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Skyline Exchange" />
  <meta property="og:title" content="Contact Skyline — Skyline Exchange" />
  <meta property="og:description" content="Reach Skyline Exchange on WhatsApp, Instagram, Google Review, or Google Maps." />
  <meta property="og:url" content="https://skylinemoneychanger.com/contactskyline" />
  <meta property="og:image" content="https://skylinemoneychanger.com/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/styles.css?v=5" />

  <!-- Meta Pixel — ID and logic live in /js/pixel.js -->
  <script>window.SKYLINE_PIXEL_EVENTS = [["ViewContent", { content_name: "Contact Skyline", content_category: "contact" }]];</script>
  <script src="/js/pixel.js?v=1" defer></script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1701643450891632&ev=PageView&noscript=1"
  /></noscript>

  <style>
    .contact-page { min-height: 100dvh; display: grid; place-items: center; padding: 120px 20px 96px; }
    .contact-box { width: min(680px, 100%); text-align: center; }

    .contact-title { font-family: var(--font-head); font-weight: 700; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -0.02em; opacity: 0; transform: translateY(18px); animation: rise 0.6s var(--ease-out) 0.1s forwards; }
    .contact-sub { margin-top: 10px; color: var(--muted); opacity: 0; transform: translateY(14px); animation: rise 0.55s var(--ease-out) 0.22s forwards; }

    .contact-grid { margin-top: 34px; display: grid; gap: 14px; grid-template-columns: 1fr; }
    .contact-btn {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 22px;
      border: 1px solid var(--border); border-radius: var(--r-card);
      background: var(--glass-strong);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      color: var(--ink);
      opacity: 0; transform: translateY(24px);
      transition: transform 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out), border-color 0.25s;
      /* ponytail: CSS keyframes, no JS animation lib for four buttons */
      animation: rise 0.55s var(--ease-out) forwards;
    }
    .contact-btn:nth-child(1) { animation-delay: 0.34s; }
    .contact-btn:nth-child(2) { animation-delay: 0.44s; }
    .contact-btn:nth-child(3) { animation-delay: 0.54s; }
    .contact-btn:nth-child(4) { animation-delay: 0.64s; }

    .contact-btn:hover { transform: translateY(-4px); box-shadow: var(--shadow-soft); border-color: rgba(0, 129, 120, 0.32); }
    .contact-btn:active { transform: translateY(-1px) scale(0.985); }

    /* ponytail: highlight WhatsApp button with a soft repeating pulse ring */
    .wa-highlight {
      position: relative;
      border-color: rgba(0, 225, 211, 0.55);
    }
    .wa-highlight::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: var(--r-card);
      box-shadow: 0 0 0 0 rgba(0, 225, 211, 0.45);
      animation: pulse-ring 2.4s ease-out infinite;
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(0, 225, 211, 0.45); }
      70% { box-shadow: 0 0 0 14px rgba(0, 225, 211, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 225, 211, 0); }
    }
    .wa-highlight:hover { transform: translateY(-4px) scale(1.01); border-color: rgba(0, 225, 211, 0.75); }
    .wa-highlight:hover::after { animation-play-state: paused; }
    .contact-btn .icon { width: 46px; height: 46px; border-radius: 14px; background: rgba(0, 225, 211, 0.16); color: var(--primary); display: grid; place-items: center; flex: 0 0 46px; transition: transform 0.25s var(--ease-out), background-color 0.25s; }
    .contact-btn:hover .icon { transform: scale(1.1); background: rgba(0, 225, 211, 0.28); }
    .contact-btn .arrow { margin-left: auto; color: var(--primary); transform: translateX(-4px); opacity: 0.7; transition: transform 0.25s var(--ease-out), opacity 0.25s; }
    .contact-btn:hover .arrow, .contact-btn:active .arrow { transform: translateX(0); opacity: 1; }

    .contact-btn .body { text-align: left; }
    .contact-btn .label { font-family: var(--font-head); font-weight: 600; font-size: 17px; }
    .contact-btn .value { font-size: 14px; color: var(--muted); }

    .back { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; font-size: 14px; color: var(--muted); opacity: 0; transform: translateY(12px); animation: rise 0.5s var(--ease-out) 0.8s forwards; transition: color 0.2s; }
    .back:hover { color: var(--primary); }

    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .map-card {
      margin-top: 22px; overflow: hidden;
      border: 1px solid var(--border); border-radius: var(--r-card);
      background: var(--glass-strong);
      box-shadow: var(--shadow-card);
      opacity: 0; transform: translateY(18px);
      animation: rise 0.55s var(--ease-out) 0.74s forwards;
    }
    .map-card iframe { width: 100%; height: clamp(260px, 40vw, 360px); border: 0; display: block; }

    @media (max-width: 640px) {
      .contact-page { padding: 104px 16px 72px; }
      .contact-btn { padding: 18px; }
      .contact-btn .icon { width: 42px; height: 42px; flex-basis: 42px; }
    }

    /* ============================================================
       Exact libraries.dev Border Beam (size: md, colorVariant: colorful)
       ============================================================ */
    @property --beam-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: true;
    }

    .border-beam-wrap {
      position: relative;
      background: #0F172A !important; /* Deep obsidian for maximum rainbow beam contrast */
      color: #FFFFFF !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 16px 40px -12px rgba(15, 23, 42, 0.38) !important;
      overflow: visible !important;
      isolation: isolate;
    }

    .border-beam-wrap .icon {
      background: rgba(251, 191, 36, 0.16) !important;
      color: #FBBF24 !important;
    }
    .border-beam-wrap .label {
      color: #FFFFFF !important;
    }
    .border-beam-wrap .value {
      color: #94A3B8 !important;
    }
    .border-beam-wrap .arrow {
      color: #00E1D3 !important;
    }

    /* 1. Outer Radiant Bloom Halo */
    .border-beam-bloom {
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(
        from var(--beam-angle),
        transparent 0%, transparent 58%,
        rgba(0, 225, 211, 0.18) 62%,
        rgba(100, 70, 255, 0.38) 67%,
        rgba(255, 50, 100, 0.65) 70%,
        rgba(255, 255, 255, 0.95) 70.5%,
        rgba(255, 120, 40, 0.65) 71.5%,
        rgba(50, 200, 80, 0.38) 73%,
        rgba(0, 225, 211, 0.18) 75%,
        transparent 82%
      );
      filter: blur(10px) brightness(1.4) saturate(1.5);
      pointer-events: none;
      z-index: 0;
      opacity: 0.8;
      animation: beam-spin 2s linear infinite;
    }

    /* 2. Inner Ambient Glass Glow (::before) */
    .border-beam-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(ellipse 70px 40px at 33% -7.4%, rgba(255, 50, 100, 0.5), transparent),
        radial-gradient(ellipse 60px 35px at 12% -5%, rgba(40, 140, 255, 0.5), transparent),
        radial-gradient(ellipse 40px 70px at 2.1% 68.3%, rgba(50, 200, 80, 0.5), transparent),
        radial-gradient(ellipse 20px 35px at 2.1% 68.3%, rgba(30, 185, 170, 0.5), transparent),
        radial-gradient(ellipse 180px 32px at 74.4% 100%, rgba(100, 70, 255, 0.5), transparent),
        radial-gradient(ellipse 85px 26px at 55% 100%, rgba(40, 140, 255, 0.5), transparent),
        radial-gradient(ellipse 74px 32px at 93.9% 0%, rgba(255, 120, 40, 0.5), transparent),
        radial-gradient(ellipse 26px 42px at 100% 27.1%, rgba(240, 50, 180, 0.5), transparent),
        radial-gradient(ellipse 52px 48px at 100% 27.1%, rgba(180, 40, 240, 0.5), transparent);
      box-shadow: inset 0 0 14px 1px rgba(255, 255, 255, 0.22);
      -webkit-mask-image:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 30%,
          rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0.35) 44%,
          white 52%, white 80%,
          rgba(255, 255, 255, 0.35) 86%, rgba(255, 255, 255, 0.1) 92%,
          transparent 95%, transparent 100%
        ),
        linear-gradient(white, transparent 28px, transparent calc(100% - 28px), white),
        linear-gradient(to right, white, transparent 28px, transparent calc(100% - 28px), white);
      -webkit-mask-composite: source-in, source-over;
      mask-image:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 30%,
          rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0.35) 44%,
          white 52%, white 80%,
          rgba(255, 255, 255, 0.35) 86%, rgba(255, 255, 255, 0.1) 92%,
          transparent 95%, transparent 100%
        ),
        linear-gradient(white, transparent 28px, transparent calc(100% - 28px), white),
        linear-gradient(to right, white, transparent 28px, transparent calc(100% - 28px), white);
      mask-composite: intersect, add;
      pointer-events: none;
      z-index: 1;
      opacity: 0.65;
      clip-path: inset(0 round var(--r-card));
      animation: beam-spin 2s linear infinite, beam-hue-shift 12s ease-in-out infinite;
    }

    /* 3. Razor-Sharp Chromatic Laser Border (::after) */
    .border-beam-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      clip-path: inset(0 round var(--r-card));
      background:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 54%,
          rgba(255, 255, 255, 0.2) 57%,
          rgba(255, 255, 255, 0.5) 60%,
          rgba(255, 255, 255, 0.9) 63%,
          #ffffff 66%,
          rgba(255, 255, 255, 0.9) 69%,
          rgba(255, 255, 255, 0.5) 72%,
          rgba(255, 255, 255, 0.2) 75%,
          transparent 78%, transparent 100%
        ),
        radial-gradient(ellipse 70px 40px at 33% -7.4%, rgb(255, 50, 100), transparent),
        radial-gradient(ellipse 60px 35px at 12% -5%, rgb(40, 140, 255), transparent),
        radial-gradient(ellipse 40px 70px at 2.1% 68.3%, rgb(50, 200, 80), transparent),
        radial-gradient(ellipse 20px 35px at 2.1% 68.3%, rgb(30, 185, 170), transparent),
        radial-gradient(ellipse 180px 32px at 74.4% 100%, rgb(100, 70, 255), transparent),
        radial-gradient(ellipse 85px 26px at 55% 100%, rgb(40, 140, 255), transparent),
        radial-gradient(ellipse 74px 32px at 93.9% 0%, rgb(255, 120, 40), transparent),
        radial-gradient(ellipse 26px 42px at 100% 27.1%, rgb(240, 50, 180), transparent),
        radial-gradient(ellipse 52px 48px at 100% 27.1%, rgb(180, 40, 240), transparent);
      -webkit-mask:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 30%,
          rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0.35) 44%,
          white 52%, white 80%,
          rgba(255, 255, 255, 0.35) 86%, rgba(255, 255, 255, 0.1) 92%,
          transparent 95%, transparent 100%
        ),
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: source-in, xor;
      mask:
        conic-gradient(
          from var(--beam-angle),
          transparent 0%, transparent 30%,
          rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0.35) 44%,
          white 52%, white 80%,
          rgba(255, 255, 255, 0.35) 86%, rgba(255, 255, 255, 0.1) 92%,
          transparent 95%, transparent 100%
        ),
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask-composite: intersect, exclude;
      pointer-events: none;
      z-index: 2;
      animation: beam-spin 2s linear infinite, beam-hue-shift 12s ease-in-out infinite;
    }

    .border-beam-wrap > *:not(.border-beam-bloom) {
      position: relative;
      z-index: 3;
    }

    .border-beam-wrap:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 22px 50px -10px rgba(0, 225, 211, 0.35) !important;
    }
    .border-beam-wrap:hover .border-beam-bloom {
      opacity: 1;
      filter: blur(14px) brightness(1.5) saturate(1.7);
    }

    @keyframes beam-spin {
      to { --beam-angle: 360deg; }
    }

    @keyframes beam-hue-shift {
      0% { filter: hue-rotate(calc(var(--beam-hue-base, 0deg) - 30deg)) brightness(1.3) saturate(1.4); }
      50% { filter: hue-rotate(calc(var(--beam-hue-base, 0deg) + 30deg)) brightness(1.3) saturate(1.4); }
      100% { filter: hue-rotate(calc(var(--beam-hue-base, 0deg) - 30deg)) brightness(1.3) saturate(1.4); }
    }

    @media (prefers-reduced-motion: reduce) {
      .contact-title, .contact-sub, .contact-btn, .back { animation: none; opacity: 1; transform: none; }
      .contact-btn, .contact-btn .icon, .contact-btn .arrow { transition: none; }
      .border-beam-wrap::before, .border-beam-wrap::after, .border-beam-bloom { animation: none; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="aurora-blob aurora-a"></div>
    <div class="aurora-blob aurora-b"></div>
    <div class="aurora-blob aurora-c"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Skyline Exchange — home">
      <img class="brand-mark" src="/assets/logo.svg?v=2" alt="" width="40" height="40" />
      <span class="brand-word">SKYLINE<em>EXCHANGE</em></span>
    </a>
  </header>

  <main class="contact-page" role="main">
    <div class="contact-box">
      <h1 class="contact-title" id="contactTitle">Contact us</h1>
      <p class="contact-sub" id="contactSub">Reach Skyline Exchange anytime.</p>
      <div class="contact-grid" id="contactGrid">
        <a id="waBtn" class="contact-btn wa-highlight" href="#" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.56 12.56 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.56 12.56 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
          <span class="body">
            <span class="label" id="waLabel">WhatsApp</span>
            <span class="value" id="waValue">Chat with us</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a id="igBtn" class="contact-btn" href="#" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </span>
          <span class="body">
            <span class="label" id="igLabel">Instagram</span>
            <span class="value" id="igValue">Follow our journey</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a id="reviewBtn" class="contact-btn border-beam-wrap" href="https://g.page/r/CQbVAW7E-dgFEBM/review" target="_blank" rel="noopener">
          <span class="border-beam-bloom" aria-hidden="true"></span>
          <span class="icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </span>
          <span class="body">
            <span class="label" id="reviewLabel">Google Review</span>
            <span class="value" id="reviewValue">Review us on Google · Support our local business</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a id="mapsBtn" class="contact-btn" href="#" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </span>
          <span class="body">
            <span class="label" id="mapsLabel">Google Maps</span>
            <span class="value" id="mapsValue">Find us in Bali</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <figure class="map-card" aria-label="Skyline Exchange location on Google Maps">
        <iframe
          id="mapFrame"
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
          title="Skyline Exchange location"
          src="https://www.google.com/maps/embed?origin=mfe&pb=!1m3!2m1!1sSkyline+Exchange+Kuta+Bali!6i15">
        </iframe>
      </figure>

      <a class="back" href="/">← Back to home</a>
    </div>
  </main>

  <script src="/config.js?v=3"></script>
  <script>
    const C = window.SITE_CONFIG || {};
    const i18n = {
      en: { title: "Contact us", sub: "Reach Skyline Exchange anytime.", wa: "Chat with us", ig: "Follow our journey", review: "Review us on Google · Support our local business", maps: "Find us in Bali" },
      id: { title: "Hubungi kami", sub: "Hubungi Skyline Exchange kapan saja.", wa: "Chat dengan kami", ig: "Ikuti kabar kami", review: "Beri ulasan di Google · Dukung bisnis lokal kami", maps: "Temukan kami di Bali" }
    };
    const lang = new URLSearchParams(location.search).get('lang') || 'en';
    const t = i18n[lang] || i18n.en;

    document.getElementById('contactTitle').textContent = t.title;
    document.getElementById('contactSub').textContent = t.sub;

    const waText = "Halo Skyline Exchange, saya mau tanya";
    const waNum = C.whatsapp || '';

    document.getElementById('waBtn').href = waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent(waText)}` : '#';
    document.getElementById('waValue').textContent = t.wa;
    document.getElementById('igBtn').href = C.instagramUrl || '#';
    document.getElementById('igValue').textContent = t.ig;
    document.getElementById('reviewBtn').href = C.reviewUrl || 'https://g.page/r/CQbVAW7E-dgFEBM/review';
    document.getElementById('reviewValue').textContent = t.review;
    document.getElementById('mapsBtn').href = C.mapsUrl || '#';
    document.getElementById('mapsValue').textContent = t.maps;

    // Fallback animation driver for browsers without CSS @property registration
    if (!window.CSS || !CSS.registerProperty) {
      let angle = 0;
      const step = () => {
        angle = (angle + 2.5) % 360;
        document.documentElement.style.setProperty('--beam-angle', `${angle}deg`);
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
  </script>
</body>
