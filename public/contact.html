  <style>
    .contact-page { min-height: 100dvh; display: grid; place-items: center; padding: 120px 20px 96px; }
    .contact-box { width: min(680px, 100%); text-align: center; }

    .contact-title { font-family: var(--font-head); font-weight: 700; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -0.02em; opacity: 0; transform: translateY(18px); animation: rise 0.6s var(--ease-out) 0.1s forwards; }
    .contact-sub { margin-top: 10px; color: var(--muted); opacity: 0; transform: translateY(14px); animation: rise 0.55s var(--ease-out) 0.22s forwards; }

    .contact-grid { margin-top: 34px; display: grid; gap: 14px; grid-template-columns: 1fr; }
    .contact-btn {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 22px;
      border: 1px solid var(--border); border-radius: var(--r-card);
      background: var(--glass-strong);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      color: var(--ink);
      opacity: 0; transform: translateY(24px);
      transition: transform 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out), border-color 0.25s;
      /* ponytail: CSS keyframes, no JS animation lib for four buttons */
      animation: rise 0.55s var(--ease-out) forwards;
    }
    .contact-btn:nth-child(1) { animation-delay: 0.34s; }
    .contact-btn:nth-child(2) { animation-delay: 0.44s; }
    .contact-btn:nth-child(3) { animation-delay: 0.54s; }
    .contact-btn:nth-child(4) { animation-delay: 0.64s; }

    .contact-btn:hover { transform: translateY(-4px); box-shadow: var(--shadow-soft); border-color: rgba(0, 129, 120, 0.32); }
    .contact-btn:active { transform: translateY(-1px) scale(0.985); }

    /* ponytail: highlight WhatsApp button with a soft repeating pulse ring */
    .wa-highlight {
      position: relative;
      border-color: rgba(0, 225, 211, 0.55);
    }
    .wa-highlight::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: var(--r-card);
      box-shadow: 0 0 0 0 rgba(0, 225, 211, 0.45);
      animation: pulse-ring 2.4s ease-out infinite;
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(0, 225, 211, 0.45); }
      70% { box-shadow: 0 0 0 14px rgba(0, 225, 211, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 225, 211, 0); }
    }
    .wa-highlight:hover { transform: translateY(-4px) scale(1.01); border-color: rgba(0, 225, 211, 0.75); }
    .wa-highlight:hover::after { animation-play-state: paused; }
    .contact-btn .icon { width: 46px; height: 46px; border-radius: 14px; background: rgba(0, 225, 211, 0.16); color: var(--primary); display: grid; place-items: center; flex: 0 0 46px; transition: transform 0.25s var(--ease-out), background-color 0.25s; }
    .contact-btn:hover .icon { transform: scale(1.1); background: rgba(0, 225, 211, 0.28); }
    .contact-btn .arrow { margin-left: auto; color: var(--primary); transform: translateX(-4px); opacity: 0.7; transition: transform 0.25s var(--ease-out), opacity 0.25s; }
    .contact-btn:hover .arrow, .contact-btn:active .arrow { transform: translateX(0); opacity: 1; }

    .contact-btn .body { text-align: left; }
    .contact-btn .label { font-family: var(--font-head); font-weight: 600; font-size: 17px; }
    .contact-btn .value { font-size: 14px; color: var(--muted); }

    .back { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; font-size: 14px; color: var(--muted); opacity: 0; transform: translateY(12px); animation: rise 0.5s var(--ease-out) 0.8s forwards; transition: color 0.2s; }
    .back:hover { color: var(--primary); }

    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .map-card {
      margin-top: 22px; overflow: hidden;
      border: 1px solid var(--border); border-radius: var(--r-card);
      background: var(--glass-strong);
      box-shadow: var(--shadow-card);
      opacity: 0; transform: translateY(18px);
      animation: rise 0.55s var(--ease-out) 0.74s forwards;
    }
    .map-card iframe { width: 100%; height: clamp(260px, 40vw, 360px); border: 0; display: block; }

    @media (max-width: 640px) {
      .contact-page { padding: 104px 16px 72px; }
      .contact-btn { padding: 18px; }
      .contact-btn .icon { width: 42px; height: 42px; flex-basis: 42px; }
    }

    /* ============================================================
       Border Beam effect (size: md, colorVariant: colorful, strength: 0.7)
       ============================================================ */
    @property --beam-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .border-beam-wrap {
      position: relative;
      border-color: rgba(0, 129, 120, 0.2);
    }

    /* Outer bloom glow (strength: 0.7) */
    .border-beam-bloom {
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
      filter: blur(10px);
      transition: opacity 0.3s var(--ease-out), filter 0.3s var(--ease-out);
    }
    .border-beam-bloom::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 60px;
      background: radial-gradient(circle, #00E1D3 0%, #7928CA 40%, #FF0080 70%, #FFAA40 90%, transparent 100%);
      offset-path: rect(0 auto auto 0 round var(--r-card));
      offset-anchor: 50% 50%;
      animation: border-beam-travel 5s linear infinite;
    }

    /* Sharp border beam line */
    .border-beam {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      pointer-events: none;
      z-index: 1;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      overflow: hidden;
    }
    .border-beam::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 60px;
      background: linear-gradient(to right, transparent 0%, #FFAA40 20%, #FF0080 45%, #7928CA 70%, #00E1D3 95%, transparent 100%);
      offset-path: rect(0 auto auto 0 round var(--r-card));
      offset-anchor: 50% 50%;
      animation: border-beam-travel 5s linear infinite;
    }

    .border-beam-wrap > *:not(.border-beam):not(.border-beam-bloom) {
      position: relative;
      z-index: 2;
    }

    .border-beam-wrap:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(0, 225, 211, 0.6);
    }
    .border-beam-wrap:hover .border-beam-bloom {
      opacity: 0.95;
      filter: blur(12px);
    }

    @keyframes border-beam-travel {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }

    /* Fallback for browsers without offset-path: rect */
    @supports not (offset-path: rect(0 auto auto 0 round 1px)) {
      .border-beam::after,
      .border-beam-bloom::after {
        display: none;
      }
      .border-beam {
        background: conic-gradient(from var(--beam-angle), #00E1D3, #7928CA, #FF0080, #FFAA40, #00E1D3);
        animation: beam-spin 4s linear infinite;
      }
      .border-beam-bloom {
        background: conic-gradient(from var(--beam-angle), #00E1D3, #7928CA, #FF0080, #FFAA40, #00E1D3);
        animation: beam-spin 4s linear infinite;
      }
      @keyframes beam-spin {
        to { --beam-angle: 360deg; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .contact-title, .contact-sub, .contact-btn, .back { animation: none; opacity: 1; transform: none; }
      .contact-btn, .contact-btn .icon, .contact-btn .arrow { transition: none; }
      .border-beam::after, .border-beam-bloom::after, .border-beam, .border-beam-bloom { animation: none; }
    }
  </style>
